name: Update country ranking

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # Runs at 7, 22, 37, and 52 minutes past the hour  
      workflow_dispatch:            # "Run workflow" button for a manual update

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Read LimeSurvey statistics and redraw
        env:
          LIMESURVEY: ${{ vars.LIMESURVEY }}
          SURVEY_ID: ${{ vars.SURVEY_ID }}
        run: python3 update_leaderboard.py
      - name: Publish if the ranking changed
        run: |
          git config user.name  "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update country ranking" && git push)

